[package]
name = "shookshmam-pc"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Cross-platform PC monitoring and control"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde.workspace = true
serde_json.workspace = true
shookshmam-sensor-model.workspace = true
shookshmam-hardware-core.workspace = true
shookshmam-telemetry.workspace = true
shookshmam-lcd-renderer.workspace = true
shookshmam-device-model.workspace = true
shookshmam-control.workspace = true
shookshmam-lighting.workspace = true
shookshmam-profiles.workspace = true
shookshmam-adapter-system.workspace = true

# Platform-specific adapters
[target.'cfg(target_os = "windows")'.dependencies]
shookshmam-adapter-windows.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
shookshmam-adapter-linux.workspace = true
