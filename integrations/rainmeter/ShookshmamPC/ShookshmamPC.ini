; Shookshmam PC — Rainmeter telemetry skin
; Reads the flat telemetry file the desktop app writes each poll
; (%APPDATA%\in.shookshmam.pc\telemetry.txt) and renders circular gauges.
;
; SETUP: set TelemetryPath below to your telemetry.txt (use forward slashes),
; then right-click the skin > Refresh. See integrations/rainmeter/README.md.

[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1

[Metadata]
Name=Shookshmam PC Telemetry
Author=Shookshmam PC
Information=Circular telemetry gauges fed by the Shookshmam PC desktop app.
Version=0.1.0
License=MIT

[Variables]
; ---- EDIT THIS to your telemetry.txt path (forward slashes) ----
TelemetryPath=C:/Users/YOURNAME/AppData/Roaming/in.shookshmam.pc/telemetry.txt
; ----------------------------------------------------------------
FontName=Segoe UI
Accent=110,211,160
AccentGpu=140,120,255
Track=52,60,72,180
PanelColor=16,22,30,235
BorderColor=46,56,70,255
TextMain=233,237,242
TextDim=154,172,192

; ============================ MEASURES ============================

[MeasureData]
Measure=Plugin
Plugin=WebParser
URL=file://#TelemetryPath#
RegExp=(?siU)cpu_temp=(.*)\ncpu_usage=(.*)\ncpu_clock=(.*)\ncpu_power=(.*)\ngpu_temp=(.*)\ngpu_hotspot=(.*)\ngpu_usage=(.*)\ngpu_clock=(.*)\nvram_used=(.*)\nvram_total=(.*)\nmem_used=(.*)\nmem_total=(.*)\nssd_temp=(.*)\nsimulated=(.*)
UpdateRate=1

[MeasureCpuTemp]
Measure=Plugin
Plugin=WebParser
URL=[MeasureData]
StringIndex=1

[MeasureCpuUsage]
Measure=Plugin
Plugin=WebParser
URL=[MeasureData]
StringIndex=2

[MeasureCpuUsageVal]
Measure=Calc
Formula=[MeasureCpuUsage]
DynamicVariables=1
MinValue=0
MaxValue=100

[MeasureCpuClock]
Measure=Plugin
Plugin=WebParser
URL=[MeasureData]
StringIndex=3

[MeasureGpuHotspot]
Measure=Plugin
Plugin=WebParser
URL=[MeasureData]
StringIndex=6

[MeasureGpuUsage]
Measure=Plugin
Plugin=WebParser
URL=[MeasureData]
StringIndex=7

[MeasureGpuUsageVal]
Measure=Calc
Formula=[MeasureGpuUsage]
DynamicVariables=1
MinValue=0
MaxValue=100

[MeasureVramUsed]
Measure=Plugin
Plugin=WebParser
URL=[MeasureData]
StringIndex=9

[MeasureVramTotal]
Measure=Plugin
Plugin=WebParser
URL=[MeasureData]
StringIndex=10

[MeasureMemUsed]
Measure=Plugin
Plugin=WebParser
URL=[MeasureData]
StringIndex=11

[MeasureMemTotal]
Measure=Plugin
Plugin=WebParser
URL=[MeasureData]
StringIndex=12

[MeasureSsdTemp]
Measure=Plugin
Plugin=WebParser
URL=[MeasureData]
StringIndex=13

[MeasureSim]
Measure=Plugin
Plugin=WebParser
URL=[MeasureData]
StringIndex=14
Substitute="1":"SIMULATED · not real hardware","0":"LIVE"

; ============================ METERS =============================

[MeterBg]
Meter=Shape
Shape=Rectangle 0,0,300,250,14 | Fill Color #PanelColor# | StrokeWidth 1 | Stroke Color #BorderColor#

[MeterTitle]
Meter=String
X=18
Y=16
FontFace=#FontName#
FontColor=#TextMain#
FontSize=13
StringStyle=Bold
AntiAlias=1
Text=SHOOKSHMAM — TELEMETRY

[MeterSub]
Meter=String
MeasureName=MeasureSim
X=18
Y=38
FontFace=#FontName#
FontColor=#TextDim#
FontSize=9
StringStyle=Bold
AntiAlias=1
Text=%1

; -------- CPU gauge --------
[MeterCpuTrack]
Meter=Roundline
MeasureName=MeasureCpuUsageVal
X=20
Y=64
W=116
H=116
StartAngle=4.712389
RotationAngle=6.283185
LineStart=40
LineLength=52
LineColor=#Track#
Solid=1
AntiAlias=1
ValueRemainder=-1

[MeterCpuRing]
Meter=Roundline
MeasureName=MeasureCpuUsageVal
X=20
Y=64
W=116
H=116
StartAngle=4.712389
RotationAngle=6.283185
LineStart=40
LineLength=52
LineColor=#Accent#
Solid=1
AntiAlias=1

[MeterCpuPct]
Meter=String
MeasureName=MeasureCpuUsage
X=78
Y=116
FontFace=#FontName#
FontColor=#TextMain#
FontSize=20
StringStyle=Bold
StringAlign=CenterCenter
AntiAlias=1
Text=%1%

[MeterCpuLabel]
Meter=String
X=78
Y=140
FontFace=#FontName#
FontColor=#TextDim#
FontSize=8
StringStyle=Bold
StringAlign=CenterCenter
AntiAlias=1
Text=CPU

[MeterCpuTemp]
Meter=String
MeasureName=MeasureCpuTemp
X=78
Y=186
FontFace=#FontName#
FontColor=#Accent#
FontSize=11
StringStyle=Bold
StringAlign=CenterCenter
AntiAlias=1
Text=%1°C

; -------- GPU gauge --------
[MeterGpuTrack]
Meter=Roundline
MeasureName=MeasureGpuUsageVal
X=164
Y=64
W=116
H=116
StartAngle=4.712389
RotationAngle=6.283185
LineStart=40
LineLength=52
LineColor=#Track#
Solid=1
AntiAlias=1
ValueRemainder=-1

[MeterGpuRing]
Meter=Roundline
MeasureName=MeasureGpuUsageVal
X=164
Y=64
W=116
H=116
StartAngle=4.712389
RotationAngle=6.283185
LineStart=40
LineLength=52
LineColor=#AccentGpu#
Solid=1
AntiAlias=1

[MeterGpuPct]
Meter=String
MeasureName=MeasureGpuUsage
X=222
Y=116
FontFace=#FontName#
FontColor=#TextMain#
FontSize=20
StringStyle=Bold
StringAlign=CenterCenter
AntiAlias=1
Text=%1%

[MeterGpuLabel]
Meter=String
X=222
Y=140
FontFace=#FontName#
FontColor=#TextDim#
FontSize=8
StringStyle=Bold
StringAlign=CenterCenter
AntiAlias=1
Text=GPU

[MeterGpuTemp]
Meter=String
MeasureName=MeasureGpuHotspot
X=222
Y=186
FontFace=#FontName#
FontColor=#AccentGpu#
FontSize=11
StringStyle=Bold
StringAlign=CenterCenter
AntiAlias=1
Text=%1°C hotspot

; -------- bottom stats --------
[MeterStats]
Meter=String
MeasureName=MeasureMemUsed
MeasureName2=MeasureMemTotal
MeasureName3=MeasureVramUsed
MeasureName4=MeasureVramTotal
MeasureName5=MeasureSsdTemp
MeasureName6=MeasureCpuClock
X=150
Y=212
FontFace=#FontName#
FontColor=#TextDim#
FontSize=9
StringAlign=CenterTop
AntiAlias=1
Text=RAM %1/%2 GB   ·   VRAM %3/%4 GB   ·   SSD %5°C   ·   CPU %6 MHz
